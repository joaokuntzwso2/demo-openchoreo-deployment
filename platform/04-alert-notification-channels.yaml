apiVersion: openchoreo.dev/v1alpha1
kind: ObservabilityAlertsNotificationChannel
metadata:
  name: platform-webhook-development
  annotations:
    demo.openchoreo.dev/display-name: "Development Alert Webhook"
    demo.openchoreo.dev/category: "Observability"
    demo.openchoreo.dev/description: "Environment-specific alert notification channel for local showcase evidence."
  labels:
    demo.openchoreo.dev/custom-artifact: "true"
  namespace: platform-demo
spec:
  environment: development
  type: webhook
  webhookConfig:
    url: http://host.k3d.internal:18081/alerts
    headers:
      Content-Type:
        value: application/json
    payloadTemplate: |
      {"alert":"${alertName}","severity":"${alertSeverity}","value":"${alertValue}","threshold":"${alertThreshold}","component":"${component}","project":"${project}","environment":"${environment}","aiRca":"${triggerAiRca}"}
---
