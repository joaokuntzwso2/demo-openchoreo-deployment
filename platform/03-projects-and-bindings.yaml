apiVersion: openchoreo.dev/v1alpha1
kind: Project
metadata:
  name: experience
  namespace: platform-demo
  annotations:
    openchoreo.dev/display-name: Platform Experience
    openchoreo.dev/description: Financial and cross-domain experience layer.
spec:
  deploymentPipelineRef:
    name: platform-standard
  type:
    kind: ClusterProjectType
    name: regulated-platform
  parameters:
    dataClassification: RESTRICTED
    criticality: MISSION_CRITICAL
    costCenter: PLAT-EXP
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: experience-development
  namespace: platform-demo
spec:
  owner:
    projectName: experience
  environment: development
  environmentConfigs:
    cpuQuota: '3'
    memoryQuota: 4Gi
    podQuota: '15'
    defaultDenyIngress: true
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: experience-staging
  namespace: platform-demo
spec:
  owner:
    projectName: experience
  environment: staging
  environmentConfigs:
    cpuQuota: '4'
    memoryQuota: 6Gi
    podQuota: '20'
    defaultDenyIngress: true
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: experience-production
  namespace: platform-demo
spec:
  owner:
    projectName: experience
  environment: production
  environmentConfigs:
    cpuQuota: '8'
    memoryQuota: 12Gi
    podQuota: '40'
    defaultDenyIngress: true
---
