apiVersion: openchoreo.dev/v1alpha1
kind: AuthzRole
metadata:
  name: platform-auditor
  annotations:
    demo.openchoreo.dev/display-name: "Platform Auditor"
    demo.openchoreo.dev/category: "Access Control"
    demo.openchoreo.dev/description: "Read-oriented OpenChoreo role for application, release and observability evidence."
  labels:
    demo.openchoreo.dev/custom-artifact: "true"
  namespace: platform-demo
spec:
  description: Read-only platform auditor with observability and AI-report visibility.
  actions:
    - namespace:view
    - project:view
    - component:view
    - resource:view
    - releasebinding:view
    - resourcereleasebinding:view
    - logs:view
    - metrics:view
    - traces:view
    - alerts:view
    - incidents:view
    - rcareport:view
    - finopsreport:view
---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRoleBinding
metadata:
  name: platform-demo-developers
  annotations:
    demo.openchoreo.dev/display-name: "Platform Demo Developers"
    demo.openchoreo.dev/category: "Access Control"
    demo.openchoreo.dev/description: "Developer authorization binding with environment-aware restrictions around production changes."
  labels:
    demo.openchoreo.dev/custom-artifact: "true"
spec:
  entitlement:
    claim: groups
    value: platform-developers
  roleMappings:
    - roleRef:
        kind: ClusterAuthzRole
        name: developer
      scope:
        namespace: platform-demo
      conditions:
        - actions:
            - releasebinding:create
            - releasebinding:update
          expression: 'resource.environment != "platform-demo/production"'
        - actions:
            - logs:view
            - metrics:view
            - traces:view
          expression: 'resource.environment in ["platform-demo/development", "platform-demo/staging"]'
    - roleRef:
        kind: ClusterAuthzRole
        name: cluster-reader
  effect: allow
---
apiVersion: openchoreo.dev/v1alpha1
kind: AuthzRoleBinding
metadata:
  name: platform-demo-auditors
  annotations:
    demo.openchoreo.dev/display-name: "Platform Demo Auditors"
    demo.openchoreo.dev/category: "Access Control"
    demo.openchoreo.dev/description: "Binds the showcase auditor subject to the platform-auditor role."
  labels:
    demo.openchoreo.dev/custom-artifact: "true"
  namespace: platform-demo
spec:
  entitlement:
    claim: groups
    value: platform-auditors
  roleMappings:
    - roleRef:
        kind: AuthzRole
        name: platform-auditor
  effect: allow
