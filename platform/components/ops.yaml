apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: k8s-ops-console
  namespace: platform-demo
  annotations:
    openchoreo.dev/display-name: Kubernetes Operations Console
spec:
  owner:
    projectName: platform-ops
  autoDeploy: true
  componentType:
    kind: ClusterComponentType
    name: deployment/service
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: k8s-ops-console
  namespace: platform-demo
spec:
  owner:
    projectName: platform-ops
    componentName: k8s-ops-console
  container:
    image: platform-demo/k8s-ops-console:1.0.0
    env:
    - key: NODE_ENV
      value: production
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility:
      - namespace
      - external
