apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: telco-mcp
  namespace: platform-demo
  annotations:
    openchoreo.dev/display-name: Governed Telco MCP Server
spec:
  owner:
    projectName: telco-network
  autoDeploy: true
  componentType:
    kind: ClusterComponentType
    name: deployment/service
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: telco-mcp
  namespace: platform-demo
spec:
  owner:
    projectName: telco-network
    componentName: telco-mcp
  container:
    image: platform-demo/telco-mcp:1.0.0
    env:
    - key: NODE_ENV
      value: production
  endpoints:
    mcp:
      type: HTTP
      port: 8080
      visibility:
      - namespace
      - external
      basePath: /mcp
  dependencies:
    endpoints:
    - component: telco-subscriber-service
      name: http
      visibility: namespace
      envBindings:
        address: SUBSCRIBER_URL
      project: telco-core
    - component: telco-network-service
      name: http
      visibility: project
      envBindings:
        address: NETWORK_URL
    - component: telco-commercial-service
      name: http
      visibility: namespace
      envBindings:
        address: COMMERCIAL_URL
      project: telco-commercial
    - component: telco-policy-service
      name: http
      visibility: namespace
      envBindings:
        address: POLICY_URL
      project: telco-commercial
---
