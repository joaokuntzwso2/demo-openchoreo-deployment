apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: telco-subscriber-service
  namespace: platform-demo
  annotations:
    openchoreo.dev/display-name: Subscriber & Service Status API
spec:
  owner:
    projectName: telco-core
  autoDeploy: true
  componentType:
    kind: ClusterComponentType
    name: deployment/service
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: telco-subscriber-service
  namespace: platform-demo
spec:
  owner:
    projectName: telco-core
    componentName: telco-subscriber-service
  container:
    image: platform-demo/telco-subscriber-service:1.0.0
    env:
    - key: NODE_ENV
      value: production
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility:
      - namespace
      - external
---
