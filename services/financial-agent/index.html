<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Operations Agent</title><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f5f7fb;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:32px}.head{display:flex;justify-content:space-between;align-items:center}.badge{border:1px solid #29364a;border-radius:999px;padding:6px 9px;color:#9bb4d4;font-size:11px}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px;margin-top:24px}.card{background:#101620;border:1px solid #222d3d;border-radius:16px;padding:18px}.server{padding:9px 0;border-bottom:1px solid #1e2937}.ok{color:#62dfa1}.bad{color:#ff7888}textarea{width:100%;min-height:110px;background:#090f17;border:1px solid #29384c;color:#fff;border-radius:11px;padding:12px;font:inherit}button{border:0;background:linear-gradient(135deg,#78a9ff,#9c7dff);color:#fff;font-weight:800;padding:10px 14px;border-radius:10px;cursor:pointer}.quick{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.quick button{background:#172236;border:1px solid #293c59;font-size:12px}.answer,.trace{white-space:pre-wrap;background:#070b11;border:1px solid #1d2735;border-radius:11px;padding:14px;margin-top:12px;font:13px ui-monospace,monospace;overflow:auto}.trace{max-height:300px;color:#abc0dd}h1{letter-spacing:-.04em;margin:7px 0}.muted{color:#8d9bb0}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><div class=wrap><div class=head><div><span class=badge>Governed MCP orchestration</span><h1>Financial Operations Agent</h1><div class=muted>Connected to OpenChoreo control/observability MCP plus customer, risk and compliance tools.</div></div><a href="http://openchoreo.localhost:8080" style="color:#88afff">OpenChoreo ↗</a></div><div class=grid><div class=card><h3>MCP connectivity</h3><div id=status>Discovering tools…</div></div><div class=card><h3>Ask the operations agent</h3><div class=quick><button onclick=q('Show customer C001, accounts, fraud signals and payment policies.')>Customer 360</button><button onclick=q('Investigate payment service incidents and summarize the likely root cause.')>Investigate incident</button><button onclick=q('Show the OpenChoreo projects and explain the payments topology.')>Explain topology</button></div><textarea id=prompt placeholder="Ask about the platform, customer, risk, compliance or an incident…"></textarea><div style="margin-top:10px"><button onclick=send()>Run agent</button></div><div id=answer class=answer>Ready.</div><div id=trace class=trace>Tool trace will appear here.</div></div></div></div><script>const base=location.pathname==='/'?'':location.pathname.replace(/\/+$/,'');const api=p=>base+p;async function r(p,o={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);try{const x=await fetch(api(p),{...o,signal:c.signal});const d=await x.json();if(!x.ok)throw Error(d.error||`HTTP ${x.status}`);return d}finally{clearTimeout(t)}}function q(x){prompt.value=x}async function load(){try{const d=await r('/api/mcp-status');status.innerHTML=d.status.map(x=>`<div class=server><b>${x.server}</b><br><span class=${x.ok?'ok':'bad'}>${x.ok?`${x.toolCount} tools ready`:`${x.error}`}</span></div>`).join('')}catch(e){status.textContent=e.message}}async function send(){answer.textContent='Discovering and executing tools…';trace.textContent='';try{const d=await r('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:prompt.value})});answer.textContent=d.answer;trace.textContent=JSON.stringify(d.trace,null,2)}catch(e){answer.textContent=`Agent error: ${e.message}`}}load();</script></body></html>
