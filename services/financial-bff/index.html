<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Services Experience</title><style>:root{--bg:#071019;--p:#0d1a27;--l:#1d3449;--t:#f5f9ff;--m:#8da3b8;--c:#57e2c5;--b:#73a9ff;--r:#ff7d8d;--y:#f5c967}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#112c3d,transparent 32%),var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1350px;margin:auto;padding:30px}.header{display:flex;justify-content:space-between;align-items:center}.k{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--c);font-weight:800}h1{font-size:31px;letter-spacing:-.04em;margin:6px 0}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px;margin-top:22px}.card{background:linear-gradient(180deg,#0d1c2a,#0a1621);border:1px solid var(--l);border-radius:17px;padding:18px}.s4{grid-column:span 4}.s8{grid-column:span 8}.s12{grid-column:span 12}.metric{font-size:28px;font-weight:850}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select{padding:10px 12px;border-radius:9px}button{background:linear-gradient(135deg,var(--c),#6fbaff);border:0;font-weight:800;color:#06221d;cursor:pointer}button.alt{background:#112437;color:#d9e8f8;border:1px solid #25435d}select{background:#071522;color:#fff;border:1px solid #25435d}.timeline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:15px 0}.step{border:1px solid #28425a;border-radius:999px;padding:6px 9px;color:#a8bdd0;font-size:11px}.step.on{color:#69e4b8;border-color:#286d55;background:#0e2b24}.code{background:#050c12;border:1px solid #152c3d;border-radius:11px;padding:13px;white-space:pre-wrap;overflow:auto;min-height:190px;max-height:430px;color:#c6e3f3;font:12px ui-monospace,monospace}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #163043}.item:last-child{border:0}.good{color:#68e1aa}.bad{color:var(--r)}@media(max-width:850px){.s4,.s8{grid-column:span 12}}</style></head><body><div class=wrap><div class=header><div><div class=k>OpenChoreo · Financial domain</div><h1>Financial Services Experience</h1><div class=muted>Customer context · payment orchestration · fraud · compliance · managed state</div></div><a style="color:#7fe7cf" href="http://openchoreo.localhost:8080" target=_blank>OpenChoreo ↗</a></div><div class=grid><div class="card s4"><div class=k>Customer</div><div id=customer class=metric>Loading…</div><div id=accounts class=muted></div></div><div class="card s8"><div class=k>Payment decision</div><h3>Run a business transaction</h3><div class=row><select id=preset><option value=normal>Normal payment</option><option value=challenge>Step-up challenge</option><option value=hold>Compliance hold</option><option value=block>Fraud block</option></select><button onclick=pay()>Process transaction</button></div><div class=timeline><span class=step>Experience</span><span>→</span><span class=step>Payments</span><span>→</span><span class=step>Fraud</span><span>+</span><span class=step>Compliance</span><span>→</span><span class=step>Valkey</span></div><pre id=result class=code>Ready.</pre></div><div class="card s12"><div class=row style="justify-content:space-between"><h3>Recent decisions</h3><button class=alt onclick=history()>Refresh</button></div><div id=history class=muted>Loading…</div></div></div></div><script>const base=location.pathname==='/'?'':location.pathname.replace(/\/+$/,'');const api=p=>base+p;const pretty=x=>JSON.stringify(x,null,2);async function req(p,o={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(api(p),{...o,signal:c.signal});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw Error(raw.slice(0,180))}if(!r.ok)throw Error(d.error||d.message||`HTTP ${r.status}`);return d}finally{clearTimeout(t)}}async function load(){try{const d=await req('/api/overview?customerId=C001');customer.textContent=d.customer.name;accounts.innerHTML=`${d.customer.segment||''} · KYC ${d.customer.kyc}<br><br>`+d.accounts.map(a=>`${a.type}: <b>${a.currency} ${Number(a.balance).toLocaleString()}</b>`).join('<br>')}catch(e){customer.textContent=e.message}history()}const p={normal:{customerId:'C001',amount:1250,currency:'BRL',beneficiaryName:'Loja Exemplo SA',destinationCountry:'BR',deviceId:'device-maria-1',channel:'WEB'},challenge:{customerId:'C001',amount:25000,currency:'BRL',beneficiaryName:'Novo Beneficiario',destinationCountry:'BR',deviceId:'new-device-demo',channel:'WEB'},hold:{customerId:'C001',amount:750,currency:'BRL',beneficiaryName:'Test Sanctioned Person',destinationCountry:'BR',deviceId:'device-maria-1',channel:'WEB'},block:{customerId:'C001',amount:80000,currency:'BRL',beneficiaryName:'Treasury Demo',destinationCountry:'BR',deviceId:'new-device-demo',channel:'API'}};async function pay(){result.textContent='Processing through Payments → Fraud + Compliance…';document.querySelectorAll('.step').forEach(x=>x.classList.remove('on'));try{const d=await req('/api/pay',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...p[preset.value],transactionId:`TX-DEMO-${Date.now()}`})});result.textContent=pretty(d);document.querySelectorAll('.step').forEach(x=>x.classList.add('on'));history()}catch(e){result.textContent=`Transaction failed: ${e.message}`}}async function history(){try{const d=await req('/api/payments');history.innerHTML=(d.payments||[]).slice(0,10).map(x=>`<div class=item><span><b>${x.transactionId}</b> · ${x.beneficiaryName}</span><span class=${x.status==='ACCEPTED'?'good':'bad'}>${x.status} · ${x.currency} ${x.amount}</span></div>`).join('')||'No transactions yet.'}catch(e){history.textContent=e.message}}load();</script></body></html>
